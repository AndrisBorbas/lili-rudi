<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200" fill="none">
  <!-- Confetti pieces -->
  <circle cx="45" cy="60" r="4" fill="#645453"/>
  <circle cx="155" cy="50" r="4" fill="#645453"/>
  <rect x="52" y="35" width="6" height="6" fill="#645453" transform="rotate(15 55 38)"/>
  <rect x="145" y="85" width="6" height="6" fill="#645453" transform="rotate(-20 148 88)"/>
  <line x1="40" y1="95" x2="48" y2="103" stroke="#645453" stroke-width="3" stroke-linecap="round"/>
  <line x1="160" y1="120" x2="168" y2="128" stroke="#645453" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Party popper cone -->
  <path d="M 75 165 L 100 85 L 125 165 Z" fill="none" stroke="#645453" stroke-width="4" stroke-linejoin="round"/>
  
  <!-- Cone opening/rim -->
  <ellipse cx="100" cy="165" rx="25" ry="8" fill="none" stroke="#645453" stroke-width="4"/>
  
  <!-- Decorative lines on cone -->
  <line x1="85" y1="145" x2="90" y2="160" stroke="#645453" stroke-width="3"/>
  <line x1="100" y1="125" x2="100" y2="145" stroke="#645453" stroke-width="3"/>
  <line x1="115" y1="145" x2="110" y2="160" stroke="#645453" stroke-width="3"/>
  
  <!-- Explosion/confetti burst lines -->
  <path d="M 100 85 L 95 65" stroke="#645453" stroke-width="3" stroke-linecap="round"/>
  <path d="M 100 85 L 110 60" stroke="#645453" stroke-width="3" stroke-linecap="round"/>
  <path d="M 100 85 L 120 70" stroke="#645453" stroke-width="3" stroke-linecap="round"/>
  <path d="M 100 85 L 80 70" stroke="#645453" stroke-width="3" stroke-linecap="round"/>
</svg>